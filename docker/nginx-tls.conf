# Конфиг для боевого домена с сертификатом Let's Encrypt.
#
# Как включить:
#   1. certbot certonly --standalone -d tanks.example.com   (на хосте, порт 80 свободен)
#   2. подставить домен ниже вместо tanks.example.com
#   3. в docker-compose.yml раскомментировать монтирование этого файла и /etc/letsencrypt
#   4. docker compose up -d --build web

upstream game_server {
    server server:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name tanks.example.com;

    # Обновление сертификата оставляем доступным по http.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tanks.example.com;

    ssl_certificate /etc/letsencrypt/live/tanks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanks.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        proxy_pass http://game_server/health;
    }

    location /ws {
        proxy_pass http://game_server;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
