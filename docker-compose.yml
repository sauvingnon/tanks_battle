services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      MAX_PLAYERS: 32
    expose:
      - "8080"
    # Игровой цикл однопоточный: одного ядра ему хватает с большим запасом.
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - leaderboard-data:/app/data

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - ./docker/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  leaderboard-data:
